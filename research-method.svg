<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="t d"><title id="t">How Moreshwar Research Lab connects ideas to real-world learning</title><desc id="d">Four connected stages: Question, Research, Connect and Apply, with examples of essays, books and practical experiments.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e2c"/><stop offset="1" stop-color="#233d4d"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".07"/></pattern></defs><rect width="1200" height="540" rx="24" fill="url(#bg)"/><rect width="1200" height="540" rx="24" fill="url(#grid)"/><text x="58" y="72" font-family="Arial,sans-serif" font-size="19" letter-spacing="4" fill="#e8ae79">OUR METHOD / 001</text><text x="58" y="138" font-family="Georgia,serif" font-size="54" fill="#fff">Curiosity becomes understanding.</text><text x="58" y="180" font-family="Arial,sans-serif" font-size="21" fill="#bacbd0">An idea is useful when you can question it, connect it, and apply it.</text><g font-family="Arial,sans-serif"><rect x="58" y="240" width="240" height="216" rx="16" fill="#f7efe2"/><rect x="340" y="240" width="240" height="216" rx="16" fill="#f7efe2"/><rect x="622" y="240" width="240" height="216" rx="16" fill="#f7efe2"/><rect x="904" y="240" width="240" height="216" rx="16" fill="#f7efe2"/><g fill="#a84e30" font-size="21" font-weight="bold"><text x="85" y="285">01 / ASK</text><text x="367" y="285">02 / EXPLORE</text><text x="649" y="285">03 / CONNECT</text><text x="931" y="285">04 / APPLY</text></g><g fill="#172b37" font-size="29" font-weight="bold"><text x="85" y="345">Question</text><text x="367" y="345">Research</text><text x="649" y="345">Make sense</text><text x="931" y="345">Experiment</text></g><g fill="#4d5b5f" font-size="19"><text x="85" y="388">What do I know?</text><text x="367" y="388">Read with care.</text><text x="649" y="388">Find the patterns.</text><text x="931" y="388">Test in real life.</text></g><g fill="#e8ae79"><path d="M309 340l20 0m-7-8 8 8-8 8" stroke="#e8ae79" stroke-width="4" fill="none"/><path d="M591 340l20 0m-7-8 8 8-8 8" stroke="#e8ae79" stroke-width="4" fill="none"/><path d="M873 340l20 0m-7-8 8 8-8 8" stroke="#e8ae79" stroke-width="4" fill="none"/></g></g></svg>
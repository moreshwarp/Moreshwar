<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="t d"><title id="t">Distributed service request and replica failure model</title><desc id="d">A teaching diagram: client request enters a gateway, is sent to replica A and replica B, and a timeout from replica B triggers retry and evidence collection.</desc><rect width="1100" height="580" rx="20" fill="#132724"/><g stroke="#2f5048" opacity=".45"><path d="M40 90H1060M40 180H1060M40 270H1060M40 360H1060M40 450H1060"/><path d="M130 40V540M330 40V540M530 40V540M730 40V540M930 40V540"/></g><g font-family="system-ui, sans-serif" fill="#eaf4ee"><text x="56" y="65" font-size="24" font-weight="700">Distributed system / request flow</text><text x="56" y="94" font-size="15" fill="#a7c9be">Conceptual teaching model — not measured production architecture</text></g><g font-family="system-ui,sans-serif" text-anchor="middle" font-weight="700"><rect x="64" y="225" width="180" height="112" rx="15" fill="#dcefdc"/><text x="154" y="272" fill="#184334" font-size="19">Client</text><text x="154" y="297" fill="#3b6854" font-size="14" font-weight="400">Sends request</text><rect x="347" y="225" width="180" height="112" rx="15" fill="#bbd9d2"/><text x="437" y="272" fill="#173d39" font-size="19">Gateway</text><text x="437" y="297" fill="#345e56" font-size="14" font-weight="400">Routes requests</text><rect x="668" y="133" width="194" height="112" rx="15" fill="#bfe8d7"/><text x="765" y="180" fill="#134636" font-size="19">Replica A</text><text x="765" y="205" fill="#345e56" font-size="14" font-weight="400">Responds</text><rect x="668" y="321" width="194" height="112" rx="15" fill="#f5caad"/><text x="765" y="368" fill="#70442e" font-size="19">Replica B</text><text x="765" y="393" fill="#82563e" font-size="14" font-weight="400">Times out</text></g><g fill="none" stroke-width="5" stroke-linecap="round"><path d="M244 281h103" stroke="#8bd0b7"/><path d="M527 265h54v-76h87" stroke="#8bd0b7"/><path d="M527 299h54v78h87" stroke="#edaa7f" stroke-dasharray="10 10"/><path d="M862 377h83v-150h-83" stroke="#edaa7f" stroke-dasharray="10 10"/></g><g fill="#8bd0b7"><path d="m333 271 14 10-14 10z"/><path d="m655 179 13 10-13 10z"/></g><g fill="#edaa7f"><path d="m655 367 13 10-13 10z"/></g><g font-family="system-ui,sans-serif" fill="#d6ede1" font-size="15"><text x="550" y="158">Successful path</text><text x="550" y="463" fill="#f7c6a5">Timeout / retry path</text><text x="66" y="514" fill="#b8d2c8">Question: How does retry policy affect latency and correctness?</text></g></svg>
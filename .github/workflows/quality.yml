name: Portfolio quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check app.js
          node --check contact.js
          node --check lab.js
          node --check visual.js
          node --check scripts/build-content.cjs
          node --check scripts/sync-feedback.cjs
          node --check reader-feedback.js
          node --check inquiry.js
      - name: Run zero-dependency regression tests
        run: node --test tests/*.test.cjs

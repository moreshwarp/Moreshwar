name: Deploy Moreshwar / Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site/assets
          cp index.html styles.css app.js lab.css lab.js experience.css contact.js visual-theme.css mobile-fix.css universe.css visual.js reader-theme.css publisher.css inquiry.css inquiry.js science-ideas.css science-ideas.js editorial.css reader-feedback.css reader-feedback.js config.js substack-posts.json message-received.html _site/
          cp -R assets/. _site/assets/
          cp -R articles _site/
          mkdir -p _site/data
          cp data/science-cabinet.json _site/data/science-cabinet.json
          touch _site/.nojekyll
      - name: Open new reader discussions (GitHub Issues)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-feedback.cjs _site
      - name: Build owner-published articles, recommendations and theme
        run: node scripts/build-content.cjs _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
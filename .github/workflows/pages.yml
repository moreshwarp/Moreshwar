name: Deploy Moreshwar / Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
  browser:
    uses: ./.github/workflows/browser-qa.yml
    permissions:
      contents: read
  deploy:
    needs: [quality, browser]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare site from canonical manifest
        run: node scripts/prepare-site.cjs _site
      - name: Render current branded social preview PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert --width 1200 --height 630 _site/social-preview.svg --output _site/social-preview.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          raw = Path('_site/social-preview.png').read_bytes()
          assert raw[:8] == b'\x89PNG\r\n\x1a\n', 'Missing valid social preview PNG'
          assert struct.unpack('>II', raw[16:24]) == (1200, 630), 'Wrong social preview dimensions'
          print('Verified branded 1200x630 social PNG')
          PY
      - name: Open new reader discussions (GitHub Issues)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-feedback.cjs _site
      - name: Build owner-published articles, recommendations and theme
        run: node scripts/build-content.cjs _site
      - name: Build and validate discovery catalog
        run: |
          python3 scripts/build_catalog.py --output _site/data/research-catalog.json
          go run ./tools/catalogcheck _site
      - name: Finalize every article and verify all internal links
        run: |
          node scripts/finalize-site.cjs _site
          node scripts/apply-text-mode.cjs _site
          node scripts/audit-site.cjs _site site-audit.json
      - name: Embed exact merged commit in published homepage
        run: node scripts/release-health.cjs stamp _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public production revision and published social assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/release-health.cjs verify
name: Deploy Moreshwar / Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - name: Prepare site
        run: |
          node scripts/prepare-site.cjs _site
      - name: Open new reader discussions (GitHub Issues)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-feedback.cjs _site
      - name: Build owner-published articles, recommendations and theme
        run: node scripts/build-content.cjs _site
      - name: Build and validate discovery catalog
        run: |
          python3 scripts/build_catalog.py --output _site/data/research-catalog.json
          go run ./tools/catalogcheck _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
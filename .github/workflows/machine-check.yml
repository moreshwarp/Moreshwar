name: Machine Check compatibility
on:
  push:
    paths:
      - 'assets/machine-check/machine_check.py'
      - '.github/workflows/machine-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install psutil
      - run: python assets/machine-check/machine_check.py --seconds 2 --no-open --output sample
      - run: python assets/machine-check/machine_check.py --seconds 2 --no-open --output sample
